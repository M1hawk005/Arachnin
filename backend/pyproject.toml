[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "arachnin"
version = "0.2.1"
description = "Secure asynchronous web ingestion for RAG pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic==1.19.1",
  "beautifulsoup4==4.15.0",
  "celery==5.6.3",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "redis==8.1.0",
  "requests==2.34.2",
  "sqlalchemy==2.0.52",
  "trafilatura==2.2.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
