[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "arachnin"
version = "2.0.0"
description = "Secure asynchronous web ingestion for RAG pipelines"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "alembic==1.16.5",
  "beautifulsoup4==4.13.4",
  "celery==5.6.3",
  "fastapi==0.139.0",
  "psycopg[binary]==3.2.9",
  "redis==6.4.0",
  "requests==2.32.5",
  "sqlalchemy==2.0.51",
  "trafilatura==2.1.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.4",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]
